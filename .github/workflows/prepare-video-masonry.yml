name: Prepare asymmetric video gallery
on:
  push:
    branches: [site/video-masonry-20261003]
    paths: [.github/workflows/prepare-video-masonry.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: '1'
      BASE: 9d6b81330b32605d0b17aca230262e05f3e89262
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Prepare isolated video layout assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          root = Path('assets/portfolio')
          css = '''/* Video-only masonry. Full-screen playback always retains the source proportions. */
          #portfolio-grid {
            --video-columns: 2;
            --video-gap: 6px;
            grid-auto-flow: row;
          }
          #portfolio-grid.is-masonry {
            position: relative;
            display: block;
            isolation: isolate;
            overflow: visible;
          }
          #portfolio-grid.is-masonry > .portfolio-card {
            position: absolute;
            top: var(--tile-top, 0px);
            left: var(--tile-left, 0px);
            width: var(--tile-width, 100%);
            height: var(--tile-height, auto);
            grid-area: auto;
            margin: 0;
            border-radius: 5px;
          }
          #portfolio-grid.is-masonry > .portfolio-card img {
            object-fit: cover;
            object-position: var(--preview-position, 50% 42%);
            transform: none;
          }
          #portfolio-grid.is-masonry > .portfolio-card:hover img,
          #portfolio-grid.is-masonry > .portfolio-card:focus-visible img {
            transform: none;
          }
          #portfolio-more[hidden] { display: none !important; }
          @media (min-width: 760px) {
            #portfolio-grid { --video-columns: 3; }
          }
          @media (min-width: 1100px) {
            #portfolio-grid { --video-columns: 4; }
          }
          '''
          js = '''/* Preserve DOM/player order; place each next preview in the shortest column. */
          (() => {
            'use strict';
            const grid = document.getElementById('portfolio-grid');
            const more = document.getElementById('portfolio-more');
            if (!grid) return;
            const previewRhythm = [9/16, 1, 4/3, 2/3, 1, 9/16, 4/3, 3/4];
            let frame = 0;
            let measuredWidth = -1;
            function updateButton(expanded, total) {
              if (!more) return;
              more.hidden = total <= 8;
              more.classList.toggle('is-visible', total > 8);
              more.setAttribute('aria-expanded', String(expanded));
              more.setAttribute('aria-controls', grid.id);
              const ru = more.querySelector('[data-lang="ru"]');
              const en = more.querySelector('[data-lang="en"]');
              if (ru) ru.textContent = expanded ? 'Скрыть −' : 'Смотреть ещё +';
              if (en) en.textContent = expanded ? 'Show less −' : 'See more +';
            }
            function layout() {
              frame = 0;
              const cards = Array.from(grid.children).filter(el => el.classList.contains('portfolio-card'));
              const width = grid.getBoundingClientRect().width;
              if (width <= 0) return;
              const style = getComputedStyle(grid);
              const columns = Math.max(1, parseInt(style.getPropertyValue('--video-columns'), 10) || 2);
              const gap = Math.max(0, parseFloat(style.getPropertyValue('--video-gap')) || 6);
              const tileWidth = (width - gap * (columns - 1)) / columns;
              const heights = Array(columns).fill(0);
              const items = window.OMBEREG_PORTFOLIO || [];
              const expanded = grid.classList.contains('show-more');
              cards.forEach((card, index) => {
                card.classList.toggle('is-more', index >= 8);
                if (index >= 8 && !expanded) return;
                const item = items[index] || {};
                const customRatio = Number(item.previewRatio);
                const ratio = Number.isFinite(customRatio) && customRatio >= .4 && customRatio <= 2.5
                  ? customRatio
                  : item.layout === 'square' ? 1 : previewRhythm[index % previewRhythm.length];
                let column = 0;
                for (let i = 1; i < columns; i++) {
                  if (heights[i] < heights[column]) column = i;
                }
                const tileHeight = tileWidth / ratio;
                card.style.setProperty('--tile-width', tileWidth + 'px');
                card.style.setProperty('--tile-height', tileHeight + 'px');
                card.style.setProperty('--tile-left', column * (tileWidth + gap) + 'px');
                card.style.setProperty('--tile-top', heights[column] + 'px');
                heights[column] += tileHeight + gap;
              });
              grid.style.height = Math.max(0, Math.max(...heights) - gap) + 'px';
              grid.classList.add('is-masonry');
              updateButton(expanded, cards.length);
            }
            function schedule() {
              if (!frame) frame = requestAnimationFrame(layout);
            }
            new MutationObserver(schedule).observe(grid, {
              childList: true, attributes: true, attributeFilter: ['class']
            });
            if ('ResizeObserver' in window) {
              new ResizeObserver(entries => {
                const width = entries[0].contentRect.width;
                if (Math.abs(width - measuredWidth) > .25) {
                  measuredWidth = width;
                  schedule();
                }
              }).observe(grid);
            }
            window.addEventListener('resize', schedule, {passive: true});
            layout();
          })();
          '''
          def unindent(text):
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in text.splitlines()) + '\n'
          (root/'video-masonry-v1.css').write_text(unindent(css))
          (root/'video-masonry-v1.js').write_text(unindent(js))
          index = Path('index.html')
          before = index.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(before)).encode()+b'\0'+before).hexdigest() == '9999bdd3906e6031116a08fb159aae0a608fd803', 'Index changed; reconcile before applying'
          html = before.decode()
          anchor = '<link rel="stylesheet" href="assets/portfolio/video-preview-v2.css">'
          added = '\n<link rel="stylesheet" href="assets/portfolio/video-masonry-v1.css">\n<script src="assets/portfolio/video-masonry-v1.js" defer></script>'
          assert html.count(anchor) == 1 and 'video-masonry-v1.js' not in html
          html = html.replace(anchor, anchor+added, 1)
          assert html.replace(added, '').encode() == before
          index.write_text(html)
          subprocess.run(['node','--check',str(root/'video-masonry-v1.js')], check=True)
          print('Prepared exactly two new asset files and two include lines; catalog, videos, covers and planets are unchanged.')
          PY
      - name: Install browser test tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0 > /tmp/masonry-install.log 2>&1 || { tail -60 /tmp/masonry-install.log; exit 1; }
          python -m playwright install --with-deps chromium >> /tmp/masonry-install.log 2>&1 || { tail -60 /tmp/masonry-install.log; exit 1; }
      - name: Test four live works and a twenty-item layout fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from playwright.sync_api import sync_playwright
          import threading, json, re
          class QuietHandler(SimpleHTTPRequestHandler):
              def log_message(self,*args): pass
          server=ThreadingHTTPServer(('127.0.0.1',8765),QuietHandler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          review=Path('.review'); review.mkdir(exist_ok=True)
          text=Path('assets/portfolio/portfolio-data.js').read_text()
          original=json.loads(text[text.index('['):text.rindex(']')+1])
          assert len(original)==4
          # Synthetic entries reuse existing media only for geometry/interaction tests.
          # They are NOT published or added to the real catalog.
          fixture=[dict(original[i%4],id='test-work-%02d'%(i+1),layout='tall',group='featured' if i<8 else 'more') for i in range(16)]
          fixture += [dict(item,group='more') for item in original]
          results=[]
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for data,label in [(original,'live-four'),(fixture,'synthetic-twenty')]:
                  for width in [320,390,414,768,1280]:
                      page=browser.new_page(viewport={'width':width,'height':896},device_scale_factor=1)
                      errors=[]
                      page.on('pageerror',lambda e:errors.append(str(e)))
                      page.route('**/assets/portfolio/portfolio-data.js*',lambda route:route.fulfill(status=200,content_type='application/javascript',body='window.OMBEREG_PORTFOLIO = '+json.dumps(data)+';'))
                      page.goto('http://127.0.0.1:8765/',wait_until='load')
                      page.wait_for_selector('#portfolio-grid.is-masonry',state='attached')
                      page.locator('#portfolio-grid').scroll_into_view_if_needed()
                      page.wait_for_timeout(200)
                      assert page.locator('#portfolio-grid > .portfolio-card:visible').count()==min(8,len(data))
                      def geometry():
                          return page.evaluate('''() => [...document.querySelectorAll('#portfolio-grid > .portfolio-card')].filter(e=>e.getClientRects().length).map(e=>{const r=e.getBoundingClientRect();return {id:e.dataset.videoId,x:r.x,y:r.y,w:r.width,h:r.height,bottom:r.bottom,right:r.right};})''')
                      def check(rects):
                          assert [r['id'] for r in rects]==[d['id'] for d in data[:len(rects)]]
                          assert all(rects[i]['y']<=rects[i+1]['y']+.05 for i in range(len(rects)-1)), 'Order changed'
                          for i,a in enumerate(rects):
                              assert a['x']>=0 and a['right']<=width+.1
                              for b in rects[i+1:]:
                                  overlap_x=min(a['right'],b['right'])-max(a['x'],b['x'])
                                  overlap_y=min(a['bottom'],b['bottom'])-max(a['y'],b['y'])
                                  assert not (overlap_x>.1 and overlap_y>.1), 'Overlap'
                              same_col=[b for b in rects[i+1:] if abs(b['x']-a['x'])<.1]
                              if same_col: assert abs(same_col[0]['y']-a['bottom']-6)<.1, 'Unequal vertical gap'
                          xs=sorted(set(round(r['x'],2) for r in rects))
                          for a,b in zip(xs,xs[1:]): assert abs(b-a-rects[0]['w']-6)<.1, 'Unequal horizontal gap'
                      before=geometry(); check(before)
                      assert page.locator('#portfolio-grid .portfolio-play svg').count()==len(data)
                      assert len(set(round(r['h'],1) for r in before))>=3
                      if len(data)>8:
                          more=page.locator('#portfolio-more')
                          assert more.is_visible()
                          assert 'Смотреть ещё' in more.inner_text()
                          more.click()
                          page.wait_for_function("document.querySelector('#portfolio-more').getAttribute('aria-expanded')==='true'")
                          assert page.locator('#portfolio-grid > .portfolio-card:visible').count()==20
                          check(geometry())
                          # Existing player opens in the original data order, never column order.
                          page.locator('#portfolio-grid > .portfolio-card').first.click()
                          for i in range(len(data)):
                              assert page.locator('#portfolio-modal-count').inner_text()==f'{i+1} / {len(data)}'
                              assert page.locator('#portfolio-modal-media video').get_attribute('src')==data[i]['video']
                              if i+1<len(data): page.locator('#portfolio-next').click()
                          page.locator('#portfolio-modal-close').click()
                          more.click()
                          page.wait_for_function("document.querySelector('#portfolio-more').getAttribute('aria-expanded')==='false'")
                          assert page.locator('#portfolio-grid > .portfolio-card:visible').count()==8
                          check(geometry())
                      else:
                          assert not page.locator('#portfolio-more').is_visible()
                          if width==414:
                              page.locator('#portfolio-grid').screenshot(path=str(review/'live-four-masonry.png'),animations='disabled')
                      assert page.locator('.project-planet').count()==7
                      assert page.locator('#art-grid .art-card').count()==10
                      assert not errors,errors
                      result={'dataset':label,'viewport':width,'visible':len(before),'total':len(data),'gap':6,'status':'PASS'}
                      results.append(result); print(json.dumps(result))
                      page.close()
              browser.close()
          server.shutdown()
          (review/'test-results.json').write_text(json.dumps(results,indent=2))
          print('ALL_MASONRY_TESTS_PASSED')
          PY
      - name: Save the tested site-only patch to a separate review branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_INDEX_FILE="$RUNNER_TEMP/masonry-site-index"
          git read-tree "$BASE"
          git add index.html assets/portfolio/video-masonry-v1.css assets/portfolio/video-masonry-v1.js
          TREE=$(git write-tree)
          COMMIT=$(printf '%s\n' 'Use compact asymmetric masonry previews and show eight videos before See more' | git commit-tree "$TREE" -p "$BASE")
          git diff-tree --no-commit-id --name-only -r "$COMMIT"
          git push origin "$COMMIT:refs/heads/site/video-masonry-ready-20261003"
          echo "REVIEW_COMMIT=$COMMIT" | tee .review/commit.txt
      - name: Save review results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: video-masonry-review
          path: .review/
          include-hidden-files: true
          retention-days: 3
