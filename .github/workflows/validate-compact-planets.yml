name: Validate compact planets
on:
  push:
    branches: [site/compact-planets-20261002]
    paths: [.github/workflows/validate-compact-planets.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: '1'
      WEBKIT_DISABLE_COMPOSITING_MODE: '1'
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install pinned test tools
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 playwright==1.55.0 PyYAML==6.0.2 > /tmp/planet-install.log 2>&1 || { tail -80 /tmp/planet-install.log; exit 1; }
          python -m playwright install --with-deps chromium webkit >> /tmp/planet-install.log 2>&1 || { tail -80 /tmp/planet-install.log; exit 1; }
          echo 'Image tools, Chromium and WebKit installed.'
      - name: Prepare exact reviewed patch and improve Safari focus return
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml, subprocess, re
          workflow = yaml.safe_load(Path('.github/workflows/prepare-compact-planets.yml').read_text())
          steps = workflow['jobs']['prepare']['steps']
          prepare = next(s['run'] for s in steps if s.get('name') == 'Prepare PNG assets and scoped layout')
          subprocess.run(['bash', '-e', '-c', prepare], check=True)
          path = Path('assets/projects/planets-v4.js')
          js = path.read_text()
          marker = '  let previousInert = false;'
          assert marker in js
          js = js.replace(marker, marker + "\n  universe.addEventListener('click', event => {\n    const button = event.target.closest('.project-planet');\n    if (button && universe.contains(button)) returnFocus = button;\n  }, true);")
          js = js.replace('      returnFocus = document.activeElement;', "      if (!returnFocus?.isConnected) returnFocus = document.activeElement;")
          path.write_text(js)
          subprocess.run(['node', '--check', str(path)], check=True)
          Path('.review').mkdir(exist_ok=True)
          tests = next(s['run'] for s in steps if s.get('name') == 'Test layout, motion and project dialogs')
          tests = tests.replace('import threading, json', 'import threading, json\nfrom pathlib import Path')
          tests = tests.replace('device_scale_factor=2', 'device_scale_factor=1')
          tests = tests.replace('for engine in [p.chromium, p.webkit]:', 'for engine in [p.chromium]:')
          marker = "            assert abs(data[2]['cx'] - (data[0]['cx'] + data[1]['cx']) / 2) < 1"
          assert marker in tests
          tests = tests.replace(marker, marker + "\n            if width == 414:\n                page.locator('.project-universe').screenshot(path='.review/planets-' + engine.name + '-414.png', animations='disabled')\n                page.screenshot(path='.review/context-' + engine.name + '-414.png', animations='disabled')")
          Path('/tmp/planet-tests.sh').write_text(tests)
          # A focused fixture tests the exact production component in WebKit without
          # the unrelated full-page animated backdrop that crashes Linux WebKit.
          html = Path('index.html').read_text()
          universe = re.search(r'<div class="about-visual project-universe"[\s\S]*?</div>', html).group(0)
          start = html.index('<div class="project-modal"')
          modal = html[start:html.index('<script>', start)]
          start = html.index('.project-modal{')
          modal_css = html[start:html.index('.skills{', start)]
          start = html.index("  const projectUniverse = document.querySelector('.project-universe');")
          component_js = html[start:html.index('})();', start)]
          head = '<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><style>:root{--display-font:Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;background:#040514;color:#f5f7ff;font-family:Arial,sans-serif}main{height:100svh;overflow:auto}h3,p{margin:0}[data-lang="en"]{display:none}' + modal_css + '</style><link rel="stylesheet" href="assets/projects/planets-v4.css"><script src="assets/projects/planets-v4.js" defer></script></head><body>'
          fixture = head + '<main><div style="height:100svh"></div>' + universe + '<div style="height:100svh"></div></main>' + modal + '<script>(()=>{' + component_js + '})();</script></body></html>'
          Path('.review/fixture.html').write_text(fixture)
          print('Prepared original production component fixture for WebKit.')
          PY
      - name: Chromium full-page regression tests
        run: |
          set -o pipefail
          bash -e /tmp/planet-tests.sh 2>&1 | tee .review/chromium-test-log.txt
      - name: WebKit project component tests
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee .review/webkit-test-log.txt
          from playwright.sync_api import sync_playwright
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          import threading, json
          class QuietHandler(SimpleHTTPRequestHandler):
              def log_message(self, *args): pass
          server = ThreadingHTTPServer(('127.0.0.1', 8765), QuietHandler)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          with sync_playwright() as p:
              browser = p.webkit.launch()
              for width in [390, 414]:
                  page = browser.new_page(viewport={'width':width,'height':896}, device_scale_factor=1)
                  errors = []
                  page.on('pageerror', lambda error: errors.append(str(error)))
                  page.goto('http://127.0.0.1:8765/.review/fixture.html', wait_until='load')
                  page.evaluate("document.querySelector('.project-universe').scrollIntoView({block:'center',behavior:'instant'})")
                  page.wait_for_function("[...document.querySelectorAll('.project-planet img')].every(i => i.complete && i.naturalWidth === 320)")
                  page.wait_for_function("document.querySelector('.project-universe').classList.contains('projects-active')")
                  data = page.evaluate('''() => [...document.querySelectorAll('.project-planet')].map(b => {
                    const img = b.querySelector('img'), label = b.querySelector('.project-planet-name');
                    const ir = img.getBoundingClientRect(), lr = label.getBoundingClientRect();
                    return {name:b.dataset.project, gap:lr.top-ir.bottom, left:lr.left, right:lr.right, animation:getComputedStyle(img).animationName, state:getComputedStyle(img).animationPlayState, src:img.currentSrc};
                  })''')
                  assert len(data) == len(set(d['src'] for d in data)) == len(set(d['animation'] for d in data)) == 5
                  assert all(d['gap'] >= 5 and d['left'] >= 0 and d['right'] <= width and d['state'] == 'running' for d in data), data
                  if width == 414:
                      page.locator('.project-universe').screenshot(path='.review/planets-webkit-component-414.png', animations='disabled')
                  for i, expected in enumerate(['SoulLux','Brax','Seaversum','NadopenArts','OMuseum']):
                      button = page.locator('.project-planet').nth(i)
                      button.click()
                      page.wait_for_selector('.project-modal.is-open')
                      page.wait_for_function("document.getElementById('project-modal-image').complete && document.getElementById('project-modal-image').naturalWidth === 320")
                      assert page.locator('#project-modal-title').inner_text() == expected
                      assert page.evaluate("document.querySelector('main').inert")
                      page.keyboard.press('Tab')
                      assert page.evaluate("document.activeElement.id === 'project-modal-close'")
                      page.keyboard.press('Escape')
                      page.wait_for_selector('.project-modal.is-open', state='hidden')
                      page.wait_for_function("!document.querySelector('main').inert")
                      assert button.evaluate('(el) => document.activeElement === el')
                  page.evaluate("document.querySelector('main').scrollTo(0,0)")
                  page.wait_for_function("[...document.querySelectorAll('.project-planet img')].every(i => getComputedStyle(i).animationPlayState === 'paused')")
                  page.emulate_media(reduced_motion='reduce')
                  assert page.evaluate("[...document.querySelectorAll('.project-planet img')].every(i => getComputedStyle(i).animationName === 'none')")
                  assert not errors, errors
                  print('PASS WebKit component', width, json.dumps(data))
                  page.close()
              browser.close()
          server.shutdown()
          print('WEBKIT_COMPONENT_TESTS_PASSED')
          PY
      - name: Push clean validated website commit
        env:
          BASE: 07ce9bf898cf54f3c09ea29fdf554e4c0feb0bb1
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_INDEX_FILE="$RUNNER_TEMP/planet-output-index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree "$BASE"
          git add index.html assets/projects/*-v4.png assets/projects/*-v4.webp assets/projects/planets-v4.css assets/projects/planets-v4.js
          TREE=$(git write-tree)
          COMMIT=$(printf '%s\n' 'Refine project planets: compact transparent PNGs, gentle motion and separate labels' | git commit-tree "$TREE" -p "$BASE")
          git diff-tree --no-commit-id --name-only -r "$COMMIT"
          git push origin "$COMMIT:refs/heads/site/compact-planets-ready-20261002"
          echo "VALIDATED_COMMIT=$COMMIT" | tee .review/commit.txt
          echo "Chromium full-page and WebKit component validated commit: $COMMIT" >> "$GITHUB_STEP_SUMMARY"
      - name: Save visual review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compact-planets-review
          path: .review/
          include-hidden-files: true
          retention-days: 3
