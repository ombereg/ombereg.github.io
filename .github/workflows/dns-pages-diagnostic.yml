name: Current HTTPS status

on:
  push:
    branches:
      - dns-diagnostic-2026-10-06

permissions:
  contents: read
  pages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub Pages state and live certificate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +x
          echo "=== Pages API ==="
          curl -sS             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          echo
          echo "=== HTTPS HEAD ==="
          curl -Iv --max-time 15 https://ombereg.art || true
          echo
          echo "=== CERT ==="
          echo | openssl s_client -connect ombereg.art:443 -servername ombereg.art 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true
