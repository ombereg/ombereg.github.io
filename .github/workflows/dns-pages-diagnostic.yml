name: Check default GitHub Pages URL

on:
  push:
    branches:
      - dns-diagnostic-2026-10-06

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secure fallback URL
        shell: bash
        run: |
          echo "=== https://ombereg.github.io ==="
          curl -sS -I --max-redirs 0 --max-time 15 https://ombereg.github.io || true
          echo "=== follow redirects ==="
          curl -sS -I -L --max-redirs 5 --max-time 20 https://ombereg.github.io || true
