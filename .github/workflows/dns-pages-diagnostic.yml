name: Full GitHub Pages DNS audit

on:
  push:
    branches:
      - dns-diagnostic-2026-10-06

permissions:
  contents: read
  pages: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit DNS and Pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "=== NS ==="
          dig +short NS ombereg.art
          echo "=== A public ==="
          dig +short A ombereg.art
          echo "=== AAAA public ==="
          dig +short AAAA ombereg.art
          echo "=== www CNAME ==="
          dig +short CNAME www.ombereg.art
          echo "=== CAA ==="
          dig +short CAA ombereg.art
          echo "=== wildcard A ==="
          dig +short A does-not-exist-ombereg-test.ombereg.art
          echo "=== authoritative ns1 A ==="
          dig +short A ombereg.art @ns1.reg.ru
          echo "=== authoritative ns2 A ==="
          dig +short A ombereg.art @ns2.reg.ru
          echo "=== authoritative ns1 CAA ==="
          dig +short CAA ombereg.art @ns1.reg.ru
          echo "=== authoritative ns2 CAA ==="
          dig +short CAA ombereg.art @ns2.reg.ru
          echo "=== Pages API ==="
          curl -sS             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
