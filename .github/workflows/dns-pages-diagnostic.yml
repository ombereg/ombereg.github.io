name: Verify GitHub Pages domain TXT

on:
  push:
    branches:
      - dns-diagnostic-2026-10-06

permissions:
  contents: read
  pages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check verification TXT
        shell: bash
        run: |
          echo "=== default resolver ==="
          dig +short TXT _github-pages-challenge-ombereg.ombereg.art
          echo "=== Google DNS ==="
          dig +short TXT _github-pages-challenge-ombereg.ombereg.art @8.8.8.8
          echo "=== Cloudflare DNS ==="
          dig +short TXT _github-pages-challenge-ombereg.ombereg.art @1.1.1.1
          echo "=== authoritative ns1.reg.ru ==="
          dig +short TXT _github-pages-challenge-ombereg.ombereg.art @ns1.reg.ru
          echo "=== authoritative ns2.reg.ru ==="
          dig +short TXT _github-pages-challenge-ombereg.ombereg.art @ns2.reg.ru
