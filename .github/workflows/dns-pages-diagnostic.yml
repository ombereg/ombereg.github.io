name: Check Ombereg DNS migration and HTTPS

on:
  push:
    branches:
      - dns-diagnostic-2026-10-06

permissions:
  contents: read
  pages: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify parent delegation and prepared Cloudflare zone
        shell: bash
        run: |
          set +e
          date -u '+Checked at %Y-%m-%dT%H:%M:%SZ'
          echo '=== Current parent registry delegation (not recursive cache) ==='
          parents=$(dig +time=3 +tries=1 +short @8.8.8.8 art NS | sort | head -n 2)
          for parent in $parents; do
            echo "Parent: $parent"
            dig +time=3 +tries=1 +norecurse +noall +answer +authority @"$parent" ombereg.art NS
            dig +time=3 +tries=1 +norecurse +noall +answer +authority @"$parent" ombereg.art DS
          done
          for resolver in 8.8.8.8 1.1.1.1 leia.ns.cloudflare.com rory.ns.cloudflare.com; do
            echo "=== Resolver: $resolver ==="
            for type in NS A AAAA MX TXT CAA; do
              echo "--- ombereg.art $type ---"
              dig +time=3 +tries=1 +noall +answer +authority @"$resolver" ombereg.art "$type"
            done
            echo '--- www CNAME ---'
            dig +time=3 +tries=1 +noall +answer +authority @"$resolver" www.ombereg.art CNAME
            echo '--- GitHub ownership TXT ---'
            dig +time=3 +tries=1 +noall +answer +authority @"$resolver" _github-pages-challenge-ombereg.ombereg.art TXT
          done
          exit 0
      - name: Read current Pages state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --silent --show-error --fail --max-time 20 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            | jq '{status,cname,html_url,source,protected_domain_state,https_certificate,https_enforced}'
      - name: Check HTTP and certificate-validated HTTPS
        shell: bash
        run: |
          set +e
          for url in http://ombereg.art/ https://ombereg.art/ http://www.ombereg.art/ https://www.ombereg.art/; do
            echo "=== $url ==="
            curl --silent --show-error --head --max-time 15 "$url" | grep -Ei '^(HTTP/|location:|server:|date:|content-type:|last-modified:|strict-transport-security:)'
            result=${PIPESTATUS[0]}
            echo "curl_exit=$result"
          done
          exit 0
